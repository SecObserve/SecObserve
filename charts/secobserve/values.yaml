# -- number of replicas to deploy
# @section -- Pod
replicaCount: 1

# -- override the chart name used in resource names
# @section -- General
nameOverride: ""

# -- fully override generated resource names
# @section -- General
fullnameOverride: ""

# -- securityContext to use for the pod
# @section -- Pod
securityContext:
  enabled: true
  fsGroup: 1001
  fsGroupChangePolicy: OnRootMismatch

# -- annotations to add to the SecObserve Pod
# @section -- Pod
podAnnotations: {}

# -- additional labels to add to the SecObserve Pod
# @section -- Pod
labels: {}

# -- additional init containers to add to the SecObserve Pod
# @section -- Pod
extraInitContainers: []

# @section -- Frontend
frontend:
  image:
    # -- image registry
    # @section -- Frontend
    registry: ghcr.io

    # -- image repository
    # @section -- Frontend
    repository: secobserve/secobserve-frontend

    # -- image tag (uses appVersion value of Chart.yaml if not specified)
    # @section -- Frontend
    tag:

    # -- image pull policy
    # @section -- Frontend
    pullPolicy: IfNotPresent

  # -- securityContext to use for frontend container
  # @section -- Frontend
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true

  env:
    # -- Base URL for API
    # @section -- Frontend
    - { name: API_BASE_URL, value: https://secobserve.dev/api }

    # -- enable OIDC authentication
    # @section -- Frontend
    - { name: OIDC_ENABLE, value: "false" }

    # -- oidc issuer
    # @section -- Frontend
    - { name: OIDC_AUTHORITY, value: https://oidc.secobserve.dev }

    # -- OIDC client ID
    # @section -- Frontend
    - { name: OIDC_CLIENT_ID, value: secobserve }

    # -- OIDC client redirect URL
    # @section -- Frontend
    - { name: OIDC_REDIRECT_URI, value: https://secobserve.dev/ }

    # -- URI to redirect to after logout
    # @section -- Frontend
    - { name: OIDC_POST_LOGOUT_REDIRECT_URI, value: https://secobserve.dev/ }

    # -- OIDC prompt
    # @section -- Frontend
    - { name: OIDC_PROMPT, value: null }

  # -- resource requirements and limits
  # @section -- Frontend
  resources:
    limits:
      cpu: 500m
      memory: 1000Mi
    requests:
      cpu: 500m
      memory: 1000Mi

  service:
    # -- service port
    # @section -- Frontend
    port: 3000

  # -- additional volume mounts for the frontend container
  # @section -- Frontend
  volumeMounts: []

  # -- additional Pod volumes used by the frontend container
  # @section -- Frontend
  volumes: []

# @section -- Backend
backend:
  # -- image registry
  # @section -- Backend
  image:
    registry: ghcr.io
    # -- image repository
    # @section -- Backend
    repository: secobserve/secobserve-backend

    # -- image tag (uses appVersion value of Chart.yaml if not specified)
    # @section -- Backend
    tag:

    # -- image pull policy
    # @section -- Backend
    pullPolicy: IfNotPresent

  # -- security context to use for the backend container
  # @section -- Backend
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true

  # -- existing Secret containing the admin password, Django secret key and field encryption key
  # @section -- Backend
  existingSecret: ""

  secretKeys:
    # -- key containing the initial admin password
    # @section -- Backend
    adminPassword: password

    # -- key containing the Django secret key
    # @section -- Backend
    djangoSecretKey: django_secret_key

    # -- key containing the field encryption key
    # @section -- Backend
    fieldEncryptionKey: field_encryption_key

  # @section -- Backend
  env:
    # -- admin user name
    # @section -- Backend
    - { name: ADMIN_USER, value: admin }

    # -- admin email address
    # @section -- Backend
    - { name: ADMIN_EMAIL, value: admin@admin.com }

    # -- allowed hosts
    # @section -- Backend
    - { name: ALLOWED_HOSTS, value: secobserve.dev }

    # -- CORS allowed origins
    # @section -- Backend
    - { name: CORS_ALLOWED_ORIGINS, value: https://secobserve.dev }

    # -- admin OIDC authority
    # @section -- Backend
    - { name: OIDC_AUTHORITY, value: https://oidc.secobserve.dev }

    # -- OIDC client id
    # @section -- Backend
    - { name: OIDC_CLIENT_ID, value: secobserve }

    # -- OIDC user name
    # @section -- Backend
    - { name: OIDC_USERNAME, value: preferred_username }

    # -- OIDC first name
    # @section -- Backend
    - { name: OIDC_FIRST_NAME, value: given_name }

    # -- OIDC last name
    # @section -- Backend
    - { name: OIDC_LAST_NAME, value: family_name }

    # -- OIDC full name
    # @section -- Backend
    - { name: OIDC_FULL_NAME, value: preferred_username }

    # -- OIDC email address
    # @section -- Backend
    - { name: OIDC_EMAIL, value: email }

    # -- OIDC groups
    # @section -- Backend
    - { name: OIDC_GROUPS, value: groups }

  # -- resource requirements and limits
  # @section -- Backend
  resources:
    limits:
      cpu: 1000m
      memory: 1500Mi
    requests:
      cpu: 1000m
      memory: 1500Mi

  service:
    # -- service port
    # @section -- Backend
    port: 5000

  # -- additional volume mounts for the backend container
  # @section -- Backend
  volumeMounts: []

  # -- additional Pod volumes used by the backend container
  # @section -- Backend
  volumes: []

# -- defines the secobserve http service
# @section -- Service
service:
  # -- Service type of service
  # @section -- Service
  type: ClusterIP
  # -- annotations to add to the Service
  # @section -- Service
  annotations: {}
  # If you want to use a NodePort service for ALB, uncomment the following line
  #type: NodePort

ingress:
  # -- If true, a Kubernetes Ingress resource will be created to the http port of the secobserve Service
  # @section -- Ingress
  enabled: true

  # -- hostname of ingress
  # @section -- Ingress
  hostname: "secobserve.dev"

  # Example configuration for using an Amazon Load Balancer controller
  # ingressClassName: alb
  # annotations:
  #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
  #   alb.ingress.kubernetes.io/ssl-policy: 'ELBSecurityPolicy-TLS13-1-2-FIPS-2023-04'
  #   alb.ingress.kubernetes.io/healthcheck-path: /
  # -- ingress class name
  # @section -- Ingress
  ingressClassName: nginx

  # -- annotations to add to ingress
  # @section -- Ingress
  annotations:
    # Use the NGINX ingress class
    kubernetes.io/ingress.class: nginx
    # Enable SSL redirect for HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Configure a custom timeout for the proxy
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"

  # -- additional paths appended to the generated ingress rule
  # @section -- Ingress
  paths: []
  # -- # TLS configuration for HTTPS
  # @section -- Ingress
  # tls:
  #   secretName: secobserve-tls

# -- Node labels to select for secobserve pod assignment
# @section -- Pod
nodeSelector: {}

# -- Toleration labels for pod assignment
# @section -- Pod
tolerations: {}

# -- Sets the affinity for the secobserve pod
# For more information on affinity, see https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
# @section -- Pod
affinity: {}

# @section -- Database
database:
  # -- Django database engine
  # @section -- Database
  engine: django.db.backends.postgresql

  # -- database hostname; inferred from the bundled PostgreSQL chart when empty
  # @section -- Database
  host: ""

  # -- database port
  # @section -- Database
  port: 5432

  # -- database name; defaults to postgresql.auth.database when empty
  # @section -- Database
  name: ""

  # -- database username; defaults to postgresql.auth.username when empty
  # @section -- Database
  username: ""

  passwordSecret:
    # -- Secret containing the database password; inferred from PostgreSQL values when empty
    # @section -- Database
    name: ""

    # -- key containing the database password; inferred from PostgreSQL values when empty
    # @section -- Database
    key: ""

# @section -- Huey
huey:
  persistence:
    # -- persist the Huey SQLite queue across backend container and Pod restarts
    # @section -- Huey
    enabled: true

    # -- use an existing PersistentVolumeClaim instead of creating one
    # @section -- Huey
    existingClaim: ""

    # -- storage class for the Huey PersistentVolumeClaim; use "-" to disable dynamic provisioning
    # @section -- Huey
    storageClass: ""

    # -- access modes for the Huey PersistentVolumeClaim
    # @section -- Huey
    accessModes:
      - ReadWriteOnce

    # -- requested storage size for the Huey PersistentVolumeClaim
    # @section -- Huey
    size: 1Gi

    # -- annotations to add to the Huey PersistentVolumeClaim
    # @section -- Huey
    annotations: {}

## PostgreSQL chart configuration
## ref: https://github.com/bitnami/charts/blob/main/bitnami/postgresql/values.yaml
## @param postgresql.enabled Switch to enable or disable the PostgreSQL helm chart
## @param postgresql.auth.postgresPassword Password for the "postgres" admin user. Ignored if `auth.existingSecret` with key `postgres-password` is provided
## @param postgresql.auth.username Name for a custom user to create
## @param postgresql.auth.password Password for the custom user to create
## @param postgresql.auth.database Name for a custom database to create
## @param postgresql.auth.existingSecret Name of existing secret to use for PostgreSQL credentials
## @param postgresql.auth.secretKeys.userPasswordKey Name of key in existing secret to use for PostgreSQL credentials. Only used when `auth.existingSecret` is set.
## @param postgresql.architecture PostgreSQL architecture (`standalone` or `replication`)
##
# @section -- Postgresql
postgresql:
  # -- Switch to enable or disable the PostgreSQL helm chart
  # @section -- Postgresql
  enabled: true

  # -- image repository override for the bundled PostgreSQL database
  # @section -- Postgresql
  image:
    repository: bitnamilegacy/postgresql

  # -- image repository overrides for the volume-permissions init container
  # @section -- Postgresql
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell

  # -- image repository overrides for PostgreSQL metrics
  # @section -- Postgresql
  metrics:
    image:
      repository: bitnamilegacy/postgres-exporter

  # -- authentication settings for the bundled PostgreSQL database
  # @section -- Postgresql
  auth:
    # -- Password for the "postgres" admin user. Ignored if `auth.existingSecret` with key `postgres-password` is provided
    # @section -- Postgresql
    postgresPassword: ""

    # -- Name for a custom user to create
    # @section -- Postgresql
    username: secobserve

    # -- Password for the custom user to create
    # @section -- Postgresql
    password: ""

    # -- Name for a custom database to create
    # @section -- Postgresql
    database: secobserve

    # -- Name of existing secret to use for PostgreSQL credentials
    # @section -- Postgresql
    existingSecret: ""

    secretKeys:
      # -- Name of key in existing secret to use for PostgreSQL credentials. Only used when `auth.existingSecret` is set.
      # @section -- Postgresql
      userPasswordKey: password

  # -- PostgreSQL architecture (`standalone` or `replication`)
  # @section -- Postgresql
  architecture: standalone

dbchecker:
  # -- enable the database readiness init container
  # @section -- dbchecker
  enabled: true

  # -- database hostname override; inferred from database settings when empty
  # @section -- dbchecker
  hostname: ""

  # -- database port checked by the init container
  # @section -- dbchecker
  port: 5432

  image:
    # -- Docker image used to check Database readiness at startup
    # @section -- dbchecker
    repository: busybox

    # -- Image digest for the dbchecker image; takes precedence over tag when set
    # @section -- dbchecker
    digest: ""

    # -- Image tag for the dbchecker image
    # @section -- dbchecker
    tag: "1.37.0"

    # -- Image pull policy for the dbchecker image
    # @section -- dbchecker
    pullPolicy: IfNotPresent

  # -- SecurityContext for the dbchecker container
  # @section -- dbchecker
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true

  # -- Resource requests and limits for the dbchecker container
  # @section -- dbchecker
  resources:
    requests:
      cpu: "20m"
      memory: "32Mi"
    limits:
      cpu: "20m"
      memory: "32Mi"
