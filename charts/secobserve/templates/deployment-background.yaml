{{- if eq (default "single" .Values.architecture) "ha" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-background" (include "secobserve.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "secobserve.labels" . | nindent 4 }}
    app.kubernetes.io/component: background
spec:
  replicas: {{ .Values.backend.background.replicaCount }}
  selector:
    matchLabels:
      {{- include "secobserve.componentSelectorLabels" (dict "context" . "component" "background") | nindent 6 }}
  # `flush_huey_inflight` and `run_huey --flush-locks` clear the locks and in-flight
  # entries of the whole queue, so two consumers must never overlap. Recreate
  # terminates the running Pod before the new one is started.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- with .Values.labels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
        {{- include "secobserve.componentSelectorLabels" (dict "context" . "component" "background") | nindent 8 }}
    spec:
      initContainers:
        {{- if .Values.dbchecker.enabled }}
        {{- include "secobserve.dbcheckerInitContainer" . | nindent 8 }}
        {{- end }}
        {{- include "secobserve.migrationsInitContainer" . | nindent 8 }}
        {{- with .Values.extraInitContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- include "secobserve.podPlacement" . | nindent 6 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.registry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args:
            - background
          env:
            {{- include "secobserve.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- with .Values.backend.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.backend.securityContext.enabled }}
          securityContext:
            {{- omit .Values.backend.securityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
      {{- with .Values.backend.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
