{{- if ne (default "single" .Values.architecture) "ha" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ printf "%s-sts" (include "secobserve.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: "{{ .Release.Namespace }}"
  labels:
    {{- include "secobserve.labels" . | nindent 4 }}
spec:
  serviceName: {{ printf "%s-svc" (include "secobserve.fullname" .) | trunc 63 | trimSuffix "-" }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "secobserve.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- with .Values.labels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
        {{- include "secobserve.selectorLabels" . | nindent 8 }}
    spec:
      {{- if or .Values.dbchecker.enabled .Values.extraInitContainers }}
      initContainers:
        {{- if .Values.dbchecker.enabled }}
        {{- include "secobserve.dbcheckerInitContainer" . | nindent 8 }}
        {{- end }}
        {{- with .Values.extraInitContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- include "secobserve.podPlacement" . | nindent 6 }}
      containers:
        - name: frontend
          image: "{{ include "secobserve.image" (dict "image" .Values.frontend.image "context" $) }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- with .Values.frontend.env }}
          env:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: frontend-http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 300
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- with .Values.frontend.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.frontend.securityContext.enabled }}
          securityContext:
            {{- omit .Values.frontend.securityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}

        - name: backend
          image: "{{ include "secobserve.image" (dict "image" .Values.backend.image "context" $) }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            {{- include "secobserve.backendEnv" . | nindent 12 }}
          ports:
            - name: backend-http
              containerPort: 5000
          livenessProbe:
            httpGet:
              path: /api/status/health/
              port: 5000
            initialDelaySeconds: 300
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/status/health/
              port: 5000
            initialDelaySeconds: 20
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- $hueyVolume := and .Values.huey.persistence.enabled (eq (include "secobserve.databaseEngine" .) "django.db.backends.sqlite3") }}
          {{- if or $hueyVolume .Values.backend.volumeMounts }}
          volumeMounts:
            {{- if $hueyVolume }}
            - name: huey
              mountPath: /var/lib/huey
            {{- end }}
            {{- with .Values.backend.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.backend.securityContext.enabled }}
          securityContext:
            {{- omit .Values.backend.securityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}

      {{- if or $hueyVolume .Values.frontend.volumes .Values.backend.volumes }}
      volumes:
        {{- if $hueyVolume }}
        - name: huey
          persistentVolumeClaim:
            claimName: {{ include "secobserve.huey.claimName" . }}
        {{- end }}
        {{- with .Values.frontend.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.backend.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
