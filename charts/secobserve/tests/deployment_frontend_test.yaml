suite: Test SecObserve frontend Deployment

templates:
  - templates/deployment-frontend.yaml

release:
  name: test-release
  namespace: test-namespace

tests:
  - it: is not rendered for the single architecture
    asserts:
      - hasDocuments:
          count: 0

  - it: serves the frontend and can be scaled
    set:
      architecture: ha
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-release-secobserve-frontend
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000

  - it: honours the configured replica count
    set:
      architecture: ha
      frontend.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: renders imagePullSecrets, hostAliases and topologySpreadConstraints
    set:
      architecture: ha
      imagePullSecrets:
        - name: registry-credentials
      hostAliases:
        - ip: 10.0.0.10
          hostnames:
            - secobserve.internal
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: "{{ .Release.Name }}"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-credentials
      - equal:
          path: spec.template.spec.hostAliases[0].hostnames[0]
          value: secobserve.internal
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/instance"]
          value: test-release

  - it: omits the pod placement options by default
    set:
      architecture: ha
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
      - notExists:
          path: spec.template.spec.hostAliases
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: pins the frontend image to the digest when set
    set:
      architecture: ha
      frontend.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/secobserve/secobserve-frontend@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: uses the tag of the frontend image when no digest is set
    set:
      architecture: ha
      frontend.image.tag: 1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/secobserve/secobserve-frontend:1.2.3
