suite: Test SecObserve frontend Deployment

templates:
  - templates/deployment-frontend.yaml

release:
  name: test-release
  namespace: test-namespace

tests:
  - it: is not rendered for the single architecture
    asserts:
      - hasDocuments:
          count: 0

  - it: serves the frontend and can be scaled
    set:
      architecture: ha
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-release-secobserve-frontend
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: frontend
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000

  - it: honours the configured replica count
    set:
      architecture: ha
      frontend.replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
