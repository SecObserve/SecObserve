suite: Test SecObserve init Job

templates:
  - templates/job-init.yaml

release:
  name: test-release
  namespace: test-namespace

tests:
  - it: is not rendered for the single architecture
    asserts:
      - hasDocuments:
          count: 0

  - it: runs the init role once before the other workloads
    set:
      architecture: ha
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-release-secobserve-init
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
      - equal:
          path: spec.template.spec.restartPolicy
          value: Never
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - init
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: dbchecker

  - it: runs before the install with an external database
    set:
      architecture: ha
      postgresql.enabled: false
      database.host: postgres.example.internal
      database.passwordSecret.name: external-db
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade

  - it: uses the configured backoffLimit
    set:
      architecture: ha
      backend.init.backoffLimit: 2
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 2

  - it: renders imagePullSecrets, hostAliases and topologySpreadConstraints
    set:
      architecture: ha
      imagePullSecrets:
        - name: registry-credentials
      hostAliases:
        - ip: 10.0.0.10
          hostnames:
            - secobserve.internal
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: "{{ .Release.Name }}"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-credentials
      - equal:
          path: spec.template.spec.hostAliases[0].hostnames[0]
          value: secobserve.internal
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/instance"]
          value: test-release

  - it: omits the pod placement options by default
    set:
      architecture: ha
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
      - notExists:
          path: spec.template.spec.hostAliases
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: pins the backend image to the digest when set
    set:
      architecture: ha
      backend.image.tag: 1.2.3
      backend.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/secobserve/secobserve-backend@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: uses backend.resources when backend.init.resources is empty
    set:
      architecture: ha
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m

  - it: uses backend.init.resources when set
    set:
      architecture: ha
      backend.init.resources:
        limits:
          cpu: 250m
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 250m
