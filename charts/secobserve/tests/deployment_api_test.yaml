suite: Test SecObserve API Deployment

templates:
  - templates/deployment-api.yaml

release:
  name: test-release
  namespace: test-namespace

tests:
  - it: is not rendered for the single architecture
    asserts:
      - hasDocuments:
          count: 0

  - it: runs the api role and can be scaled
    set:
      architecture: ha
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-release-secobserve-api
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: api
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - api
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/status/health/

  - it: waits for the database and for the migrations of the init Job
    set:
      architecture: ha
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: dbchecker
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-migrations

  - it: honours the configured replica count
    set:
      architecture: ha
      backend.api.replicaCount: 4
    asserts:
      - equal:
          path: spec.replicas
          value: 4
