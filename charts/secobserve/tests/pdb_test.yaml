suite: Test SecObserve PodDisruptionBudgets

templates:
  - templates/pdb.yaml

release:
  name: test-release
  namespace: test-namespace

tests:
  - it: is not rendered by default
    set:
      architecture: ha
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered for the single architecture
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders one budget each for the api and the frontend in ha
    set:
      architecture: ha
      podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: metadata.name
          value: test-release-secobserve-api
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: api
        documentIndex: 0
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: api
        documentIndex: 0
      - equal:
          path: spec.maxUnavailable
          value: 1
        documentIndex: 0
      - equal:
          path: metadata.name
          value: test-release-secobserve-frontend
        documentIndex: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: frontend
        documentIndex: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: frontend
        documentIndex: 1

  - it: honours the configured maxUnavailable
    set:
      architecture: ha
      podDisruptionBudget.enabled: true
      podDisruptionBudget.maxUnavailable: 2
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2
        documentIndex: 0
      - equal:
          path: spec.maxUnavailable
          value: 2
        documentIndex: 1
