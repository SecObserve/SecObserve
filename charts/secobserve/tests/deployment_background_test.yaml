suite: Test SecObserve background Deployment

templates:
  - templates/deployment-background.yaml

release:
  name: test-release
  namespace: test-namespace

tests:
  - it: is not rendered for the single architecture
    asserts:
      - hasDocuments:
          count: 0

  - it: runs a single Huey consumer that is never allowed to overlap
    set:
      architecture: ha
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: test-release-secobserve-background
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: background
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - background
      - notExists:
          path: spec.template.spec.containers[0].ports
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-migrations

  - it: restarts the consumer when a task has been running for too long
    set:
      architecture: ha
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            exec:
              command:
                - python
                - /app/manage.py
                - check_background_tasks
            initialDelaySeconds: 300
            periodSeconds: 300
            timeoutSeconds: 60
            failureThreshold: 2

  - it: applies overrides of the liveness probe
    set:
      architecture: ha
      backend.background.livenessProbe:
        initialDelaySeconds: 600
        periodSeconds: 120
        timeoutSeconds: 30
        failureThreshold: 5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command[2]
          value: check_background_tasks
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 600
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 120
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.enabled

  - it: has no liveness probe when it is disabled
    set:
      architecture: ha
      backend.background.livenessProbe.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe

  - it: renders imagePullSecrets, hostAliases and topologySpreadConstraints
    set:
      architecture: ha
      imagePullSecrets:
        - name: registry-credentials
      hostAliases:
        - ip: 10.0.0.10
          hostnames:
            - secobserve.internal
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: "{{ .Release.Name }}"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: registry-credentials
      - equal:
          path: spec.template.spec.hostAliases[0].hostnames[0]
          value: secobserve.internal
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].labelSelector.matchLabels["app.kubernetes.io/instance"]
          value: test-release

  - it: omits the pod placement options by default
    set:
      architecture: ha
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
      - notExists:
          path: spec.template.spec.hostAliases
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: pins the backend images to the digest when set
    set:
      architecture: ha
      backend.image.digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/secobserve/secobserve-backend@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: ghcr.io/secobserve/secobserve-backend@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  - it: uses backend.resources when backend.background.resources is empty
    set:
      architecture: ha
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 1000m

  - it: uses backend.background.resources for the background and wait-for-migrations containers
    set:
      architecture: ha
      backend.background.resources:
        limits:
          cpu: 500m
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.initContainers[1].resources.limits.cpu
          value: 500m
