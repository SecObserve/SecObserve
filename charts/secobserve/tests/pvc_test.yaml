suite: Test SecObserve Huey PVC

templates:
  - templates/pvc.yaml

release:
  name: test-release
  namespace: test-namespace

tests:
  - it: is not created with the default PostgreSQL engine
    asserts:
      - hasDocuments:
          count: 0

  - it: is not created when backend.env selects PostgreSQL
    set:
      database.engine: django.db.backends.sqlite3
      backend.env:
        - name: DATABASE_ENGINE
          value: django.db.backends.postgresql
    asserts:
      - hasDocuments:
          count: 0

  - it: is created when backend.env selects SQLite
    set:
      backend.env:
        - name: DATABASE_ENGINE
          value: django.db.backends.sqlite3
    asserts:
      - hasDocuments:
          count: 1

  - it: creates a release-scoped Huey PVC with the SQLite engine
    set:
      database.engine: django.db.backends.sqlite3
    asserts:
      - equal:
          path: metadata.name
          value: test-release-secobserve-huey
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteOnce
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi

  - it: supports a custom storage class and annotations
    set:
      database.engine: django.db.backends.sqlite3
      huey.persistence.storageClass: fast
      huey.persistence.annotations:
        example.com/owner: secobserve
    asserts:
      - equal:
          path: spec.storageClassName
          value: fast
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: secobserve

  - it: does not create a PVC when an existing claim is configured
    set:
      database.engine: django.db.backends.sqlite3
      huey.persistence.existingClaim: shared-huey
    asserts:
      - hasDocuments:
          count: 0

  - it: does not create a PVC when persistence is disabled
    set:
      database.engine: django.db.backends.sqlite3
      huey.persistence.enabled: false
    asserts:
      - hasDocuments:
          count: 0
