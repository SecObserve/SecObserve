name: Check frontend

on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Prettier
        working-directory: ./frontend
        run: |
          npx prettier -c src

      - name: ESLint
        working-directory: ./frontend
        run: |
          npx eslint src

  end_to_end_tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: end_to_end_tests/package-lock.json

      - name: Install dependencies
        working-directory: ./end_to_end_tests
        run: |
          npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the backend and frontend services of docker-compose-playwright.yml in parallel, the tags are
      # the image names of the services, so that `up --no-build` uses them.
      # Only pushes to dev write the cache, all other runs only read it.
      - name: Build images
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          source: .
          files: docker-compose/docker-compose-playwright.yml
          targets: backend,frontend
          load: true
          set: |
            *.context=.
            backend.cache-from=type=gha,scope=e2e-backend
            backend.cache-to=${{ github.ref == 'refs/heads/dev' && 'type=gha,mode=max,scope=e2e-backend' || '' }}
            frontend.cache-from=type=gha,scope=e2e-frontend
            frontend.cache-to=${{ github.ref == 'refs/heads/dev' && 'type=gha,mode=max,scope=e2e-frontend' || '' }}

      - name: End-to-end tests
        run: |
          docker compose -f docker-compose/docker-compose-playwright.yml up --no-build --abort-on-container-exit --exit-code-from playwright

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            end_to_end_tests/playwright-report/
            end_to_end_tests/test-results/
          retention-days: 7

  check_code_sonarqube_frontend:
    permissions:
      contents: read
    if: >-
      github.repository == 'SecObserve/SecObserve' &&
      (github.ref == 'refs/heads/dev' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  
      - 
        name: Run SonarQube scan for frontend
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONTEND }}
        with:
          projectBaseDir: frontend
