name: Build and push release images

on:
  workflow_dispatch:
    inputs:
      #checkov:skip=CKV_GHA_7:This is a false positive
      release:
        description: 'SecObserve release (without the v)'
        required: true

permissions: {}

jobs:
  build_backend:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: 'v${{ github.event.inputs.release }}'
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set current date as env variable
        run: echo "CREATED=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV
      -
        name: Build and push backend by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/backend/prod/django/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/secobserve/secobserve-backend,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CREATED=${{ env.CREATED }}
            REVISION=${{ github.sha }}
            VERSION=${{ github.event.inputs.release }}
      -
        name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-backend-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge_backend:
    runs-on: ubuntu-latest
    needs: [build_backend]
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Create and push multi-platform manifest
        env:
          VERSION: ${{ github.event.inputs.release }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/secobserve/secobserve-backend:$VERSION" \
            -t ghcr.io/secobserve/secobserve-backend:latest \
            $(printf 'ghcr.io/secobserve/secobserve-backend@sha256:%s ' *)
        working-directory: /tmp/digests
      -
        name: Get digest of multi-platform manifest
        id: digest
        env:
          VERSION: ${{ github.event.inputs.release }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/secobserve/secobserve-backend:$VERSION" --format '{{ .Manifest.Digest }}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      -
        name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'
      -
        name: Sign image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "ghcr.io/secobserve/secobserve-backend@$DIGEST"
      -
        name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/secobserve/secobserve-backend
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  build_frontend:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: 'v${{ github.event.inputs.release }}'
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Set current date as env variable
        run: echo "CREATED=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV
      -
        name: Build and push frontend by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/frontend/prod/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/secobserve/secobserve-frontend,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            CREATED=${{ env.CREATED }}
            REVISION=${{ github.sha }}
            VERSION=${{ github.event.inputs.release }}
      -
        name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      -
        name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-frontend-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge_frontend:
    runs-on: ubuntu-latest
    needs: [build_frontend]
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      -
        name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-frontend-*
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Create and push multi-platform manifest
        env:
          VERSION: ${{ github.event.inputs.release }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/secobserve/secobserve-frontend:$VERSION" \
            -t ghcr.io/secobserve/secobserve-frontend:latest \
            $(printf 'ghcr.io/secobserve/secobserve-frontend@sha256:%s ' *)
        working-directory: /tmp/digests
      -
        name: Get digest of multi-platform manifest
        id: digest
        env:
          VERSION: ${{ github.event.inputs.release }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/secobserve/secobserve-frontend:$VERSION" --format '{{ .Manifest.Digest }}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      -
        name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'
      -
        name: Sign image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "ghcr.io/secobserve/secobserve-frontend@$DIGEST"
      -
        name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/secobserve/secobserve-frontend
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  generate_sboms:
    runs-on: ubuntu-latest
    needs: [merge_backend, merge_frontend]
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: 'v${{ github.event.inputs.release }}'
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'
      -
        name: Install programs
        env:
          CDXGEN_VERSION: 13.6.0
          TRIVY_VERSION: 0.76.1
          SBOM_UTILITY_VERSION: 0.19.2
          CYCLONE_DX_CLI_VERSION: 0.33.1
        run: |
          npm install -g @cdxgen/cdxgen@"$CDXGEN_VERSION"
          cd /usr/local/bin
          wget --no-verbose https://github.com/CycloneDX/sbom-utility/releases/download/v"$SBOM_UTILITY_VERSION"/sbom-utility-v"$SBOM_UTILITY_VERSION"-linux-amd64.tar.gz -O - | tar -zxf -
          wget --no-verbose https://github.com/CycloneDX/cyclonedx-cli/releases/download/v"$CYCLONE_DX_CLI_VERSION"/cyclonedx-linux-x64
          cp cyclonedx-linux-x64 /usr/local/bin/cyclonedx
          chmod +x /usr/local/bin/cyclonedx
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v"$TRIVY_VERSION"
      - 
        name: Generate SBOM for backend application
        env:
          VERSION: ${{ github.event.inputs.release }}
          FETCH_LICENSE: 1
        working-directory: ./sbom
        run: |
          mv ../backend/poetry_requirements.txt ../backend/poetry_requirements.sic
          sed -i "s|REPLACE_VERSION|$VERSION|g" ./configuration/patch_backend_application.json
          cdxgen ../backend --type python --required-only --profile license-compliance --no-auto-compositions --output sbom_backend_application.json --spec-version 1.6
          sbom-utility trim --keys=externalReferences,properties,evidence,authors,lifecycles --quiet --input-file sbom_backend_application.json \
            | sbom-utility patch --patch-file ./configuration/patch_supplier.json --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_backend_application.json --quiet --input-file - --output-file sbom_backend_application_"$VERSION".json
          sbom-utility validate --input-file sbom_backend_application_"$VERSION".json
          rm sbom_backend_application.json
          mv ../backend/poetry_requirements.sic ../backend/poetry_requirements.txt
      - 
        name: Generate SBOM for frontend application
        env:
          VERSION: ${{ github.event.inputs.release }}
        working-directory: ./sbom
        run: |
          sed -i "s|REPLACE_VERSION|$VERSION|g" ./configuration/patch_frontend_application.json
          cdxgen ../frontend --type npm --no-babel --required-only --profile license-compliance --no-auto-compositions --project-name secobserve --output sbom_frontend_application.json --spec-version 1.6
          sbom-utility trim --keys=externalReferences,properties,evidence,authors,lifecycles --quiet --input-file sbom_frontend_application.json \
            | sbom-utility patch --patch-file ./configuration/patch_supplier.json --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_frontend_application.json --quiet --input-file - --output-file sbom_frontend_application_"$VERSION".json
          sbom-utility validate --input-file sbom_frontend_application_"$VERSION".json
          rm sbom_frontend_application.json
      - 
        name: Generate SBOM for backend container
        env:
          VERSION: ${{ github.event.inputs.release }}
        working-directory: ./sbom
        run: |
          sed -i "s|REPLACE_VERSION|$VERSION|g" ./configuration/patch_backend_container.json
          trivy image --platform linux/amd64 --scanners license --pkg-types os --format cyclonedx --output sbom_backend_container.json ghcr.io/secobserve/secobserve-backend:$VERSION
          sbom-utility trim --keys=externalReferences,properties,evidence,authors,lifecycles,services --quiet --input-file sbom_backend_container.json \
            | sbom-utility patch --patch-file ./configuration/patch_supplier.json --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_backend_container.json --quiet --input-file - --output-file sbom_backend_container_"$VERSION".json
          sbom-utility validate --input-file sbom_backend_container_"$VERSION".json
          rm sbom_backend_container.json
      - 
        name: Generate SBOM for frontend container
        env:
          VERSION: ${{ github.event.inputs.release }}
        working-directory: ./sbom
        run: |
          sed -i "s|REPLACE_VERSION|$VERSION|g" ./configuration/patch_frontend_container.json
          trivy image --platform linux/amd64 --scanners license --pkg-types os --format cyclonedx --output sbom_frontend_container.json ghcr.io/secobserve/secobserve-frontend:$VERSION
          sbom-utility trim --keys=externalReferences,properties,evidence,authors,lifecycles,services --quiet --input-file sbom_frontend_container.json \
            | sbom-utility patch --patch-file ./configuration/patch_supplier.json --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_frontend_container.json --quiet --input-file - --output-file sbom_frontend_container_"$VERSION".json
          sbom-utility validate --input-file sbom_frontend_container_"$VERSION".json
          rm sbom_frontend_container.json
      - 
        name: Merge SBOMs
        env:
          VERSION: ${{ github.event.inputs.release }}
        working-directory: ./sbom
        run: |
          sed -i "s|REPLACE_VERSION|$VERSION|g" ./configuration/patch_complete.json
          cyclonedx merge --hierarchical --name "SecObserve" --version "$VERSION" --input-files sbom_backend_application_"$VERSION".json sbom_frontend_application_"$VERSION".json sbom_backend_container_"$VERSION".json sbom_frontend_container_"$VERSION".json --output-version v1_6 --output-format json \
            | sbom-utility trim --keys=declarations,definitions --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_supplier.json --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_complete.json --quiet --input-file - --output-file sbom_"$VERSION".json
          sbom-utility validate --input-file sbom_"$VERSION".json
      -
        name: Merge SBOMs for backend image
        env:
          VERSION: ${{ github.event.inputs.release }}
          DIGEST: ${{ needs.merge_backend.outputs.digest }}
        working-directory: ./sbom
        run: |
          sed -i "s|REPLACE_VERSION|$VERSION|g; s|REPLACE_DIGEST|${DIGEST#sha256:}|g" ./configuration/patch_backend.json
          cyclonedx merge --hierarchical --name "SecObserve Backend" --version "$VERSION" --input-files sbom_backend_application_"$VERSION".json sbom_backend_container_"$VERSION".json --output-version v1_6 --output-format json \
            | sbom-utility trim --keys=declarations,definitions --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_supplier.json --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_backend.json --quiet --input-file - --output-file sbom_backend_"$VERSION".json
          sbom-utility validate --input-file sbom_backend_"$VERSION".json
      -
        name: Merge SBOMs for frontend image
        env:
          VERSION: ${{ github.event.inputs.release }}
          DIGEST: ${{ needs.merge_frontend.outputs.digest }}
        working-directory: ./sbom
        run: |
          sed -i "s|REPLACE_VERSION|$VERSION|g; s|REPLACE_DIGEST|${DIGEST#sha256:}|g" ./configuration/patch_frontend.json
          cyclonedx merge --hierarchical --name "SecObserve Frontend" --version "$VERSION" --input-files sbom_frontend_application_"$VERSION".json sbom_frontend_container_"$VERSION".json --output-version v1_6 --output-format json \
            | sbom-utility trim --keys=declarations,definitions --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_supplier.json --quiet --input-file - \
            | sbom-utility patch --patch-file ./configuration/patch_frontend.json --quiet --input-file - --output-file sbom_frontend_"$VERSION".json
          sbom-utility validate --input-file sbom_frontend_"$VERSION".json
      -
        name: Attest SBOMs to images
        env:
          VERSION: ${{ github.event.inputs.release }}
          BACKEND_DIGEST: ${{ needs.merge_backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ needs.merge_frontend.outputs.digest }}
        working-directory: ./sbom
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom_backend_"$VERSION".json "ghcr.io/secobserve/secobserve-backend@$BACKEND_DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom_frontend_"$VERSION".json "ghcr.io/secobserve/secobserve-frontend@$FRONTEND_DIGEST"
      -
        name: Add SBOMs to GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ github.event.inputs.release }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = process.env.VERSION;
            const releaseTag = `v${version}`;
            
            console.log(`Adding SBOMs to GitHub release ${releaseTag}`);
            
            try {
              // Get the release by tag
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: releaseTag
              });
              
              // SBOM files to upload
              const sbomFiles = [
                `sbom_backend_${version}.json`,
                `sbom_frontend_${version}.json`,
                `sbom_${version}.json`
              ];
              
              // Upload each SBOM file to the release
              for (const file of sbomFiles) {
                const filePath = path.join('./sbom', file);
                
                console.log(`Uploading ${filePath} to release ${releaseTag}`);
                
                const fileContent = fs.readFileSync(filePath);
                
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  name: file,
                  data: fileContent
                });
                
                console.log(`Successfully uploaded ${file} to release ${releaseTag}`);
              }
            } catch (error) {
              console.error(`Error adding SBOMs to release: ${error.message}`);
              core.setFailed(error.message);
            }
