name: Check Helm chart

on:
  pull_request:
    paths:
      - charts/secobserve/**
      - .github/workflows/check_helm_chart.yml
  push:
    branches:
      - main
    paths:
      - charts/secobserve/**
      - .github/workflows/check_helm_chart.yml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install helm-unittest
        run: ./charts/secobserve/tests/install-helm-unittest.sh

      - name: Validate chart
        run: ./charts/secobserve/tests/test-chart.sh
