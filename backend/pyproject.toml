[project]
name = "SecObserve"
version = "1.60.0"
description = "SecObserve is an open source vulnerability management system for software development and cloud environments."
license = "BSD-3-Clause"
authors = [{ name = "Stefan Fleckenstein" }]
requires-python = ">=3.12,<3.15"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
# Django
# ------------------------------------------------------------------------------
gunicorn = "26.2.0"  # https://github.com/benoitc/gunicorn
django = "6.1.1"  # https://www.djangoproject.com/
django-environ = "0.14.0"  # https://github.com/joke2k/django-environ
django-filter = "26.1"  # https://github.com/carltongibson/django-filter 
django-picklefield = "3.4.0"  # https://github.com/gintas/django-picklefield 
django-encrypted-model-fields = "0.6.5"  # https://gitlab.com/lansharkconsulting/django/django-encrypted-model-fields
argon2-cffi = "25.1.0"  # https://github.com/hynek/argon2_cffi
whitenoise = "6.12.0"  # https://github.com/evansd/whitenoise
django-dirtyfields = "1.9.9"  # https://github.com/romgar/django-dirtyfields

# Django REST Framework
# ------------------------------------------------------------------------------
djangorestframework = "3.18.1"  # https://github.com/encode/django-rest-framework
django-cors-headers = "4.9.0" # https://github.com/adamchainz/django-cors-headers

# OpenAPI 3
# ------------------------------------------------------------------------------
drf-spectacular = "0.30.0" # https://github.com/tfranzel/drf-spectacular
drf-spectacular-sidecar = "2026.9.1"  # https://github.com/tfranzel/drf-spectacular-sidecar

# Token authentication
# ------------------------------------------------------------------------------
PyJWT = "2.14.0"  # https://github.com/jpadilla/pyjwt

# HTTP requests
# ------------------------------------------------------------------------------
requests = "2.34.2"  # https://github.com/psf/requests

# Database
# ------------------------------------------------------------------------------
pymysql = "1.2.3"  # https://github.com/PyMySQL/PyMySQL
psycopg = { version = "3.3.6", extras = ["binary"] }  # https://github.com/psycopg/psycopg

# Dataformats
# ------------------------------------------------------------------------------
defusedcsv = "3.0.0"  # https://github.com/raphaelm/defusedcsv
openpyxl = "3.1.5"  # https://foss.heptapod.net/openpyxl/openpyxl
jsonpickle = "4.1.2"  # https://github.com/jsonpickle/jsonpickle
pyyaml = "6.0.3"  # https://github.com/yaml/pyyaml

# Field specifications
# ------------------------------------------------------------------------------
packageurl-python = "0.17.6"  # https://github.com/package-url/packageurl-python
cvss = "3.6"  # https://github.com/RedHatProductSecurity/cvss
semver = "3.1.0"  # https://github.com/python-semver/python-semver
license-expression = "30.4.4"  # https://github.com/aboutcode-org/license-expression

# Task queue
# ------------------------------------------------------------------------------
huey = "3.4.0"  # https://github.com/coleifer/huey
peewee = "4.5.1"  # https://github.com/coleifer/peewee

# Issue tracker
# ------------------------------------------------------------------------------
jira = "3.10.5"  # https://github.com/pycontribs/jira

# Others
# ------------------------------------------------------------------------------
inflect = "7.5.0"  # https://github.com/jaraco/inflect
validators = "0.35.0"  # https://github.com/python-validators/validators
py-ocsf-models = "0.10.0"  # https://github.com/prowler-cloud/py-ocsf-models
spdx-tools = "0.8.5"  # https://github.com/spdx/tools-python
html-to-markdown = "3.14.3"  # https://github.com/Goldziher/html-to-markdown
cyclonedx-python-lib = "11.12.0"  # https://github.com/CycloneDX/cyclonedx-python-lib
licenselynx = "2.3.4"  # https://github.com/licenselynx/licenselynx
regopy = "1.5.2"  # https://microsoft.github.io/rego-cpp/#python-example
simplejson = "4.1.2"

# Development dependencies
# ------------------------------------------------------------------------------
# Werkzeug = { version = "3.0.4", extras = ["watchdog"], optional = true }  # https://github.com/pallets/werkzeug
Werkzeug = { version = "3.1.8", optional = true }  # https://github.com/pallets/werkzeug
ipdb = { version = "0.13.13", optional = true }  # https://github.com/gotcha/ipdb
# watchgod = { version = "0.8.2", optional = true }  # https://github.com/samuelcolvin/watchgod
django-extensions = { version = "4.1", optional = true }  # https://github.com/django-extensions/django-extensions
django-silk = { version = "5.6.0", optional = true }  # https://github.com/jazzband/django-silk

# Unittest dependencies
# ------------------------------------------------------------------------------
coverage = { version = "7.16.1", optional = true }  # https://github.com/nedbat/coveragepy
django-coverage-plugin = { version = "3.2.2", optional = true }  # https://github.com/nedbat/django_coverage_plugin

# Code quality dependencies
# ------------------------------------------------------------------------------
flake8 = { version = "7.3.0", optional = true }  # https://github.com/PyCQA/flake8
flake8-isort = { version = "7.0.0", optional = true }  # https://github.com/gforcada/flake8-isort
Flake8-pyproject = { version = "1.2.4", optional = true }  # https://github.com/john-hen/Flake8-pyproject
black = { version = "26.5.1", optional = true }  # https://github.com/psf/black
pylint = { version = "4.0.8", optional = true }  # https://github.com/pylint-dev/pylint
pylint-django = { version = "2.8.0", optional = true }  # https://github.com/PyCQA/pylint-django
mypy = { version = "2.3.1", optional = true }  # https://github.com/python/mypy
django-stubs = { version = "6.1.1", optional = true }  # https://github.com/typeddjango/django-stubs
djangorestframework-stubs = { version = "3.18.1", extras = ["requests"], optional = true }  # https://github.com/typeddjango/djangorestframework-stubs
types-PyMySQL = { version = "1.2.0.20260807", optional = true }  # https://github.com/python/typeshed
import-linter = "2.15"  # https://github.com/seddonym/import-linter

[tool.poetry.extras]
dev = ["Werkzeug", "ipdb", "django-extensions", "django-silk"]
unittests = ["coverage", "django-extensions", "django-coverage-plugin"]
code_quality = ["flake8", "flake8-isort", "Flake8-pyproject", "black", "pylint", "pylint-django", "mypy", "django-stubs", "djangorestframework-stubs", "types-PyMySQL", "import-linter"]

[tool.black]
line-length = 120
target-version = ['py314']

[tool.flake8]
extend-ignore = ["I001", "I003", "I004", "I005"]
max-line-length = 120
exclude = [
    ".tox",
    ".git",
    "*/migrations/*",
    "*/static/CACHE/*",
    "docs",
    "node_modules",
    ".venv",
    "unittests/*",
    "*unittests.py",
]

[tool.isort]
profile = "black"
known_first_party = ["application", "config", "unittests"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
implicit_optional = true
no_namespace_packages = true
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pylint.main]
load-plugins = ["pylint_django"]
django-settings-module = "config.settings.base"
ignore-paths = [".*/migrations"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "abstract-method",
    "broad-except",
    "too-few-public-methods",
    "missing-docstring",
    "invalid-name",
    "duplicate-code",
]

[tool.pylint.design]
max-args = 7
max-attributes = 10
max-locals = 20
max-parents = 13
max-returns = 7

[tool.importlinter]
root_package = "application"

[[tool.importlinter.contracts]]
id = "general_layers"
name = "General layers"
type = "layers"
layers = [
    "application.background_tasks",
    "application.import_observations",
    "application.vex | application.epss | application.metrics",
    "application.core : application.issue_tracker : application.licenses : application.notifications : application.rules",
    "application.access_control : application.authorization",
    "application.commons",
]
ignore_imports = [
    "application.access_control.api.filters -> application.authorization.services.roles_permissions",
    "application.access_control.api.filters -> application.core.models",
    "application.access_control.api.serializers -> application.core.models",
    "application.access_control.api.serializers -> application.notifications.models",
    "application.access_control.queries.user -> application.core.queries.product_member",
    "application.authorization.services.authorization -> application.*.models",
    "application.authorization.services.authorization -> application.core.queries.product_member",
    "application.authorization.services.authorization -> application.core.services.assessment_approver",
    "application.commons.api.serializers -> application.core.types",
    "application.commons.models -> application.*.types",
    "application.core.api.serializers_observation -> application.import_observations.types",
    "application.core.api.serializers_observation -> application.import_observations.api.serializers",
    "application.core.api.serializers_observation -> application.import_observations.models",
    "application.core.api.serializers_product -> application.import_observations.models",
    "application.core.migrations.0051_convert_origin_component_dependencies -> application.import_observations.parsers.cyclone_dx.dependencies",
    "application.core.queries.product -> application.metrics.models",
]

[[tool.importlinter.contracts]]
id = "module_layers"
name = "Module layers"
type = "layers"
layers = [
    "(api) | (migrations) | (tasks) | (signals)",
    "(services)",
    "(queries)",
    "(models)",
    "(types)",
]
containers = [
    "application.access_control",
    "application.authorization",
    "application.background_tasks",
    "application.commons",
    "application.core",
    "application.epss",
    "application.import_observations",
    "application.issue_tracker",
    "application.licenses",
    "application.metrics",
    "application.notifications",
    "application.rules",
    "application.vex",
]
ignore_imports = [
    "application.access_control.queries.api_token -> application.access_control.services.current_user",
    "application.access_control.queries.authorization_group_member -> application.access_control.services.current_user",
    "application.access_control.queries.authorization_group -> application.access_control.services.current_user",
    "application.access_control.queries.user -> application.access_control.services.current_user",
    "application.access_control.queries.user -> application.core.queries.product_member",
    "application.commons.models -> application.commons.services.request_cache",
    "application.core.queries.product_member -> application.access_control.services.current_user",
]

[tool.coverage.run]
branch = true
relative_files = true
include = ["application/**", "config/**"]
omit = ["**/migrations/**"]
plugins = ["django_coverage_plugin"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
